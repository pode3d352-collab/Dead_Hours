<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#161b23">
<style>[hidden]{display:none!important}html{background:#161b23}</style>
<title>Dead Hour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  color-scheme:dark;
  --asphalt:#161b23;
  --bone:#ece6d4;
  --sodium:#ffb23e;
  --blood:#d0402f;
  --font-display:'Staatliches','Impact','Arial Narrow',sans-serif;
  --font-ui:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;box-sizing:border-box;background:var(--asphalt);color:var(--bone);
  font-family:var(--font-ui);font-size:16px;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;background:var(--asphalt)}
button{font-family:var(--font-ui);color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}

/* ---------- HUD ---------- */
.ui{
  position:fixed;inset:0;pointer-events:none;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-left,0px));
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.left{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:200px}
.bar{position:relative;height:18px;background:rgba(10,12,16,.6);border:2px solid rgba(236,230,212,.5);overflow:hidden;border-radius:3px}
.bar i{position:absolute;left:0;top:0;height:100%;display:block}
#hpGhost{background:rgba(255,255,255,.6);width:100%;transition:width .5s .18s}
#hp{background:linear-gradient(#e85c45,#b02f20);width:100%;transition:width .1s}
#hpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 13px var(--font-ui);letter-spacing:.12em}
.cash{display:flex;gap:10px;align-items:baseline;font:400 22px/1 var(--font-display);letter-spacing:.06em;color:var(--sodium);white-space:nowrap}
#combo{font:700 13px var(--font-ui);letter-spacing:.14em;color:var(--bone);opacity:.85}
.mid{text-align:center}
.mid small{display:block;font:700 12px var(--font-ui);letter-spacing:.34em;opacity:.75}
#waveNum{font:400 52px/.95 var(--font-display);font-variant-numeric:tabular-nums}
.rem{font:700 12px var(--font-ui);letter-spacing:.18em;opacity:.8;white-space:nowrap}
.rem b{font:400 18px var(--font-display);letter-spacing:.06em;color:var(--sodium)}
.right{display:flex;justify-content:flex-end}
.icon{
  pointer-events:auto;width:46px;height:46px;border:2px solid rgba(236,230,212,.55);background:rgba(10,12,16,.6);
  font:400 18px/1 var(--font-display);letter-spacing:.08em;border-radius:6px;
}
.bossbar{
  position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);
  width:min(66vw,340px);height:14px;border:2px solid var(--blood);background:rgba(10,12,16,.75);border-radius:3px;
}
.bossbar i{display:block;height:100%;background:linear-gradient(#e85c45,#a32a1d);width:100%;transition:width .12s}
.bossbar span{position:absolute;left:0;right:0;top:17px;text-align:center;font:400 13px/1 var(--font-display);letter-spacing:.3em;color:var(--blood)}
.side{
  position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30%);
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.sk{
  pointer-events:auto;position:relative;width:98px;height:54px;border:2px solid rgba(236,230,212,.5);background:rgba(10,12,16,.66);
  border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 5px;
  font:400 12px/1.05 var(--font-display);letter-spacing:.08em;text-align:center;
}
.sk b{font:700 11px var(--font-ui);letter-spacing:.2em;opacity:.75;position:relative}
.sk span{position:relative}
.sk .cdv{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) calc(var(--p,0)*100%),transparent 0)}
.sk.rdy{border-color:var(--sodium);box-shadow:0 0 14px rgba(255,178,62,.5);animation:rdy 1.4s ease-in-out infinite}
.sk.lock{opacity:.45}
.sk:active{transform:scale(.96)}
@keyframes rdy{50%{box-shadow:0 0 4px rgba(255,178,62,.25)}}
#toast{
  position:absolute;left:0;right:0;top:40%;text-align:center;font:400 clamp(26px,7.5vw,44px)/1 var(--font-display);
  letter-spacing:.08em;opacity:0;transition:opacity .3s;pointer-events:none;color:var(--sodium);padding:0 16px;
}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;padding:0 12px}
#banner b{display:block;font:400 clamp(46px,15vw,92px)/.9 var(--font-display);letter-spacing:.08em}
#banner span{display:block;margin-top:8px;font:700 15px var(--font-ui);letter-spacing:.32em;color:var(--sodium)}
#banner.boss b{color:var(--blood)}
#banner.show{animation:ban 2.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.7)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}

/* ---------- Screens ---------- */
.screen{
  position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;box-sizing:border-box;overflow-y:auto;touch-action:pan-y;
  background:rgba(9,11,15,.86);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  -webkit-overflow-scrolling:touch;
}
.panel{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;margin:auto}
.tape{height:12px;background:repeating-linear-gradient(-45deg,var(--sodium) 0 14px,#15181e 14px 28px);flex:none}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--sodium)}
h1{margin:0;font:400 clamp(56px,min(24vw,17vh),116px)/.86 var(--font-display);letter-spacing:.02em;text-wrap:balance}
h2{margin:0;font:400 clamp(34px,min(12vw,9vh),62px)/.92 var(--font-display);letter-spacing:.03em;text-wrap:balance}
.panel p{margin:0;font-size:18px;line-height:1.3;max-width:36ch;color:rgba(236,230,212,.88)}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font:400 32px/1 var(--font-display);letter-spacing:.04em}
.stats b.gold{color:var(--sodium)}
.stats span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.arms{display:flex;flex-wrap:wrap;gap:8px}
.arms span{border:1px solid rgba(236,230,212,.45);padding:4px 9px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.arms span.new{border-color:var(--sodium);color:var(--sodium)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  min-height:54px;border:2px solid var(--bone);background:rgba(236,230,212,.04);border-radius:6px;
  font:400 23px/1 var(--font-display);letter-spacing:.12em;padding:0 14px;
}
.btn.main{background:var(--sodium);border-color:var(--sodium);color:#14110a}
.btn.sm{min-height:42px;font-size:18px;padding:0 12px;white-space:nowrap}
.btn.poor{opacity:.6}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn:active{transform:translateY(1px)}
.hint{font-size:15px;line-height:1.35;opacity:.7;max-width:40ch}
.hint.warn{color:var(--sodium);opacity:1}
.credit{margin-top:2px;padding-top:12px;border-top:1px solid rgba(236,230,212,.25);font:400 16px/1 var(--font-display);letter-spacing:.3em;color:var(--sodium)}
.cards{display:grid;gap:10px}
.card{border:1px solid rgba(236,230,212,.28);background:rgba(236,230,212,.05);padding:12px;display:grid;gap:8px;border-radius:6px}
.card.sel{border-color:var(--sodium);box-shadow:inset 0 0 0 1px var(--sodium)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3{margin:0;font:400 26px/1 var(--font-display);letter-spacing:.06em}
.card small{font-size:15px;opacity:.78;line-height:1.25}
.card em{font-style:normal;font:700 13px var(--font-ui);letter-spacing:.16em;color:var(--sodium);margin-left:6px}
.sbar{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font-size:12px;letter-spacing:.16em;opacity:.9}
.sbar i{display:flex;gap:3px}
.sbar i span,.pips span{flex:1;height:7px;background:rgba(236,230,212,.16);display:block}
.sbar i span.on,.pips span.on{background:var(--sodium)}
.pips{display:flex;gap:3px}
.pips span{height:9px;transform:skewX(-20deg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid rgba(236,230,212,.4);background:transparent;border-radius:20px;padding:5px 12px;font:700 13px var(--font-ui);letter-spacing:.14em}
.chip.on{border-color:var(--sodium);color:var(--sodium)}
.perks{display:grid;gap:9px}
.perk{display:grid;gap:3px;text-align:left;padding:12px;border:2px solid var(--bone);background:rgba(236,230,212,.06);border-radius:6px}
.perk b{font:400 24px/1 var(--font-display);letter-spacing:.08em;color:var(--sodium)}
.perk span{font-size:16px;opacity:.88}
.perk:active{background:rgba(255,178,62,.25)}
.taken{border:2px solid var(--sodium);border-radius:6px;padding:10px 12px;display:grid;gap:2px}
.taken b{font:400 22px/1 var(--font-display);letter-spacing:.08em;color:var(--sodium)}
#codeIn{width:100%;box-sizing:border-box;min-height:54px;background:rgba(10,12,16,.7);border:2px solid var(--sodium);border-radius:6px;color:var(--bone);font:400 24px/1 var(--font-display);letter-spacing:.12em;padding:0 14px;text-align:center;-webkit-user-select:text;user-select:text;touch-action:manipulation;outline:none}
@media (max-height:480px){
  .panel{gap:8px}
  .btn{min-height:42px;font-size:20px}
  .hint{display:none}
  .panel p{font-size:15px}
  .side{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
}
.split{display:flex;flex-direction:column;gap:14px}
.pl,.pr,.pf{display:flex;flex-direction:column;gap:14px;min-width:0}
#rot{position:fixed;inset:0;z-index:50;background:#0b0e13;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;touch-action:none}
#rot .ph{width:54px;height:94px;border:4px solid var(--sodium);border-radius:10px;animation:rotp 2.6s ease-in-out infinite}
@keyframes rotp{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot b{font:400 40px/1 var(--font-display);letter-spacing:.08em}
#rot span{font:700 14px var(--font-ui);letter-spacing:.2em;color:var(--sodium)}
@media (orientation:portrait) and (pointer:coarse){#rot:not(.off){display:flex}}
@media (orientation:landscape) and (max-height:620px){
  .screen{padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .screen.two{overflow:hidden;align-items:stretch}
  .panel{width:min(940px,100%);gap:10px}
  .screen.two .panel{margin:0 auto;height:100%}
  .split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:30px;row-gap:10px}
  .pl,.pr{gap:10px;overflow-y:auto;min-height:0;touch-action:pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .pl::-webkit-scrollbar,.pr::-webkit-scrollbar{display:none}
  .pl{grid-column:1;grid-row:1}
  .pr{grid-column:2;grid-row:1 / span 2}
  .pf{grid-column:1;grid-row:2;gap:8px}
  .pf .btns{flex-direction:row;flex-wrap:wrap;margin:0}
  .pf .btns .btn{flex:1 1 auto}
  h1{font-size:clamp(50px,19vh,96px)}
  h2{font-size:clamp(28px,10vh,46px)}
  .panel p{font-size:16px;max-width:none}
  .stats{gap:18px}
  .stats b{font-size:26px}
  .btn{min-height:44px;font-size:19px}
  .btn.sm{min-height:38px;font-size:16px}
  .hint{display:block;font-size:13px}
  .cards,.perks{gap:8px}
  .card{padding:9px 11px;gap:6px}
  .card h3{font-size:22px}
  .ui{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
  .left{max-width:230px}
  .bar{height:16px}
  .cash{font-size:19px}
  #waveNum{font-size:38px}
  .mid small{font-size:10px}
  .rem{font-size:11px}
  .rem b{font-size:15px}
  .icon{width:42px;height:42px;font-size:16px}
  .bossbar{top:calc(env(safe-area-inset-top,0px) + 78px);width:min(46vw,360px)}
  .side{top:calc(env(safe-area-inset-top,0px) + 62px);bottom:auto;gap:7px}
  .sk{width:92px;height:44px;border-radius:7px;font-size:11px}
  .sk b{font-size:10px}
  #banner{top:15%}
  #banner b{font-size:clamp(40px,16vh,70px)}
  #banner span{font-size:13px}
  #toast{top:46%;font-size:clamp(22px,8vh,34px)}
}
.dc-easy.on{border-color:#5ce071;color:#5ce071}
.dc-hard.on{border-color:#ff8a3c;color:#ff8a3c}
.dc-impossible.on{border-color:#ff3f5e;color:#ff3f5e}
.dc-nightmare.on{border-color:#c46bff;color:#c46bff}
@media (orientation:landscape) and (max-height:620px){.panel p.sub{display:none}.screen .panel h1{font-size:clamp(42px,14vh,76px)}.chips{gap:5px;flex-wrap:nowrap}.chip{padding:4px 9px;font-size:12px;letter-spacing:.08em}.pl .stats{gap:16px}}
@media (prefers-reduced-motion:reduce){#toast,#hp,#hpGhost{transition:none}.sk.rdy{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Game view"></canvas>
<div id="rot"><div class="ph"></div><b>ROTATE YOUR PHONE</b><span>DEAD HOUR PLAYS SIDEWAYS</span><button class="btn sm" id="rotOk">PLAY ANYWAY</button></div>

<div class="ui" id="hud" hidden>
  <div class="top">
    <div class="left">
      <div class="bar"><i id="hpGhost"></i><i id="hp"></i><div id="hpTxt">100 / 100</div></div>
      <div class="cash"><span id="cash">$0</span><span id="combo"></span></div>
    </div>
    <div class="mid"><small>WAVE</small><div id="waveNum">1</div><div class="rem"><b id="remain">0</b> LEFT</div></div>
    <div class="right"><button class="icon" id="pauseBtn" aria-label="Pause">II</button></div>
  </div>
  <div class="bossbar" id="bossbar" hidden><i id="bosshp"></i><span id="bossName">BOSS</span></div>
  <div class="side">
    <button class="sk" id="sk0" aria-label="Skill one"><i class="cdv"></i><b></b><span></span></button>
    <button class="sk" id="sk1" aria-label="Skill two"><i class="cdv"></i><b></b><span></span></button>
    <button class="sk" id="sk2" aria-label="Skill three"><i class="cdv"></i><b></b><span></span></button>
  </div>
  <div id="toast"></div>
  <div id="banner"></div>
</div>

<div class="screen" id="scr"><div class="panel" id="panel"></div></div>

<script>
(()=>{
'use strict';
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const WORLD=1400,TAU=Math.PI*2,FONT='Impact,"Arial Narrow",sans-serif';
let W=0,H=0,DPR=1,zoom=1,cx=WORLD/2,cy=WORLD/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  zoom=Math.max(.8,Math.min(1.5,Math.min(W,H)/470));
}
window.addEventListener('resize',resize);resize();

/* ---------- saved progress ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
};
let user=store.get('deadhour.session','')||null;
const pk=k=>user?'acct:'+user+':'+k:k;
const DIFFS={
 easy:{name:'EASY',hp:.7,sp:.85,dmg:.6,cnt:.75,gap:1.25,cash:.8,heal:.5,desc:'Weaker, slower zombies and fewer of them. Heal more between waves.'},
 normal:{name:'NORMAL',hp:1,sp:1,dmg:1,cnt:1,gap:1,cash:1,heal:.3,desc:'The intended Dead Hour experience.'},
 hard:{name:'HARD',hp:1.5,sp:1.15,dmg:1.5,cnt:1.3,gap:.85,cash:1.5,heal:.2,desc:'Tougher, faster and more zombies. Pays 50% more cash.'},
 impossible:{name:'IMPOSSIBLE',hp:4,sp:1.4,dmg:3.5,cnt:2.4,gap:.6,cash:3,heal:.05,desc:'Massive hordes that hit hard and do not let up. Almost no healing. Pays 3x cash.'},
 nightmare:{name:'NIGHTMARE',hp:6,sp:1.6,dmg:5,cnt:3.2,gap:.45,cash:5,heal:0,desc:'Endless tide of fast, tanky killers. Zero healing between waves. Pays 5x cash.'}
};
let diff=(()=>{try{const v=localStorage.getItem('deadhour.diff');return DIFFS[v]?v:'normal';}catch(e){return 'normal';}})();
const DF=()=>DIFFS[diff];
const bestKey=()=>pk(diff==='normal'?'deadhour.bestwave':'deadhour.bestwave.'+diff);
let bestWave=0;
function setDiff(d){if(!DIFFS[d])return;diff=d;store.set('deadhour.diff',d);bestWave=Math.max(0,parseInt(store.get(bestKey(),'0'),10)||0);}
let money=0,ownedChars=['basic','ember'],selectedChar='basic',upgrades={};
function loadProfile(){
  money=Math.max(0,parseInt(store.get(pk('deadhour.money'),'0'),10)||0);
  ownedChars=['basic','ember'];upgrades={};
  try{const o=JSON.parse(store.get(pk('deadhour.chars'),'["basic","ember"]'));if(Array.isArray(o))ownedChars=o;}catch(e){}
  if(!ownedChars.includes('basic'))ownedChars.unshift('basic');
  if(!ownedChars.includes('ember'))ownedChars.push('ember');
  selectedChar=store.get(pk('deadhour.char'),'basic');
  if(!ownedChars.includes(selectedChar))selectedChar='basic';
  try{upgrades=JSON.parse(store.get(pk('deadhour.upgrades'),'{}'))||{};}catch(e){upgrades={};}
  bestWave=Math.max(0,parseInt(store.get(bestKey(),'0'),10)||0);
}
loadProfile();
function saveEconomy(){if(!user)return;store.set(pk('deadhour.money'),money);store.set(pk('deadhour.chars'),JSON.stringify(ownedChars));store.set(pk('deadhour.char'),selectedChar);}
function saveUpgrades(){if(!user)return;store.set(pk('deadhour.upgrades'),JSON.stringify(upgrades));}
function saveBest(n){if(user&&n>bestWave){bestWave=n;store.set(bestKey(),n);}}
setInterval(saveEconomy,3000);

/* ---------- data ---------- */
const CHARACTERS=[
 {id:'basic',name:'BASIC',price:0,ability:'GRENADE',desc:'Classic pistol combat. Reliable and fast.',col:'#b7c4d0',st:[3,5,3],power:26,rate:.27,speed:950,range:.72,skills:[{name:'GRENADE',cost:0},{name:'RAPID FIRE',cost:400},{name:'EXPLOSIVE SHOWER',cost:900}]},
 {id:'ember',name:'EMBER',price:0,ability:'INFERNO BEAM',desc:'Fire bolts and a piercing Inferno Beam.',col:'#ff7a2e',st:[3,4,3],power:34,rate:.32,speed:760,range:1.0,skills:[{name:'INFERNO BEAM',cost:0},{name:'FLAME BURST',cost:400},{name:'METEOR RAIN',cost:900}]},
 {id:'volt',name:'VOLT',price:120,ability:'BOLT DASH',desc:'Spinning spark stars. Dash through the horde.',col:'#9a7bff',st:[4,3,3],power:44,rate:.46,speed:650,range:1.15,skills:[{name:'BOLT DASH',cost:0},{name:'CHAIN LIGHTNING',cost:400},{name:'THUNDER NOVA',cost:900}]},

let AC=null,noiseBuf=null,master=null,comp=null,muted=false;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    comp=AC.createDynamicsCompressor();comp.threshold.value=-10;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.2;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=.9;master.connect(comp);
    const n=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    loadVoice();
  }catch(e){AC=null;}
}
function noise(dur,freq,vol,delay,type,to){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);
  if(to)f.frequency.exponentialRampToValueAtTime(to,t+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.02);
}
function tone(f1,f2,dur,vol,type,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
const lastSfx={};
function can(k,ms){const n=performance.now();if(n-(lastSfx[k]||0)<ms)return false;lastSfx[k]=n;return true;}
function sfx(k){
  if(!AC||muted)return;
  switch(k){
    case 'gun':if(!can(k,40))return;noise(.09,3200,.2,0,'highpass',900);tone(220,70,.08,.1,'square');break;
    case 'ki':if(!can(k,40))return;tone(520,880,.12,.1,'sawtooth');noise(.12,2400,.08,0,'bandpass',900);break;
    case 'star':if(!can(k,40))return;tone(900,1400,.09,.08,'triangle');tone(1400,700,.1,.06,'triangle',.06);break;
    case 'punch':if(!can(k,40))return;noise(.08,700,.3);tone(140,60,.1,.2,'square');break;
    case 'kick':if(!can(k,40))return;noise(.07,500,.3);tone(180,80,.12,.22,'sine');break;
    case 'beam':noise(.6,3000,.4,0,'bandpass',300);tone(180,900,.5,.2,'sawtooth');tone(90,60,.6,.25,'square');break;
    case 'boom':if(!can(k,60))return;noise(.65,500,.7);tone(90,30,.5,.3,'sawtooth');break;
    case 'hit':if(!can(k,30))return;noise(.05,900,.12);tone(300,150,.05,.05,'square');break;
    case 'crit':if(!can(k,50))return;tone(1200,1800,.1,.12,'triangle');tone(1800,2400,.1,.08,'triangle',.05);noise(.06,1200,.12);break;
    case 'die':if(!can(k,45))return;tone(150,50,.28,.12,'sawtooth');noise(.18,600,.12);break;
    case 'hurt':tone(230,90,.22,.22,'square');noise(.14,700,.2);break;
    case 'coin':tone(900,1400,.07,.12,'square');tone(1400,1900,.1,.12,'square',.07);break;
    case 'heal':tone(500,800,.12,.12,'triangle');tone(800,1200,.18,.12,'triangle',.1);break;
    case 'click':tone(260,180,.05,.1,'square');break;
    case 'buy':tone(660,880,.08,.12,'square');tone(880,1100,.08,.12,'square',.08);tone(1100,1500,.14,.12,'square',.16);break;
    case 'deny':tone(170,110,.18,.14,'sawtooth');break;
    case 'ready':if(!can(k,200))return;tone(700,1100,.08,.07,'triangle');break;
    case 'wave':tone(110,110,.7,.2,'sawtooth');tone(165,165,.7,.14,'sawtooth');noise(.5,300,.1);break;
    case 'clear':[523,659,784,1047].forEach((f,i)=>tone(f,f,.22,.13,'triangle',i*.1));break;
    case 'boss':tone(70,36,1.1,.32,'sawtooth');noise(1,400,.3);tone(140,50,.9,.15,'square',.1);break;
    case 'groan':if(!can(k,600))return;{const f=rnd(70,120);tone(f,f*.6,.55,.07,'sawtooth');noise(.4,380,.05);}break;
    case 'dash':noise(.2,3000,.25,0,'bandpass',600);tone(300,900,.15,.1,'sawtooth');break;
    case 'zap':noise(.3,5000,.3,0,'highpass',2000);tone(1800,200,.25,.12,'sawtooth');break;
    case 'slam':noise(.5,350,.6);tone(80,30,.4,.35,'sine');break;
    case 'hiss':if(!can(k,150))return;noise(.45,4000,.18,0,'highpass',3000);break;
    case 'heart':tone(60,40,.12,.35,'sine');tone(55,38,.14,.3,'sine',.16);break;
    case 'over':[330,262,196,131].forEach((f,i)=>tone(f,f*.9,.3,.16,'sawtooth',i*.2));break;
    case 'skill':noise(.25,2500,.25,0,'bandpass',500);tone(300,700,.2,.12,'triangle');break;
    case 'sonic':if(!can(k,40))return;tone(420,180,.14,.14,'sine');tone(840,360,.12,.07,'triangle');break;
  }
}

function duck(sec){
  if(!AC||!master)return;
  const t=AC.currentTime,g=master.gain;
  g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(.16,t+.05);
  g.setValueAtTime(.16,t+sec);g.linearRampToValueAtTime(.9,t+sec+.35);
}
function buildAaah(ac,dest,t){
  const dur=1.7;
  const out=ac.createGain();
  out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.8,t+.08);out.gain.setValueAtTime(.8,t+dur-.6);out.gain.exponentialRampToValueAtTime(.001,t+dur);
  const vib=ac.createOscillator(),vg=ac.createGain();vib.frequency.value=5.4;
  vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(7,t+.5);vib.connect(vg);
  const src=ac.createGain();src.gain.value=.34;
  [-9,0,9].forEach(det=>{
    const o=ac.createOscillator();o.type='sawtooth';o.detune.value=det;
    o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(240,t+.2);o.frequency.linearRampToValueAtTime(215,t+dur);
    vg.connect(o.frequency);o.connect(src);o.start(t);o.stop(t+dur+.05);
  });
  vib.start(t);vib.stop(t+dur+.05);
  [[730,8,1],[1090,10,.7],[2440,12,.35],[3400,14,.15]].forEach(([f,q,g])=>{
    const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;
    const gg=ac.createGain();gg.gain.value=g*3.4;src.connect(b);b.connect(gg);gg.connect(out);
  });
  out.connect(dest);
  const d=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();
  d.delayTime.value=.2;fb.gain.value=.38;wet.gain.value=.45;
  out.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(dest);
}
function aaah(){
  if(!AC||muted)return;
  duck(2.0);buildAaah(AC,comp||master,AC.currentTime);
}
let voiceEl=null,voiceBuf=null,voiceLoading=false;
function loadVoice(){
  if(voiceBuf||voiceLoading||!AC)return;voiceLoading=true;
  try{
    const bin=atob(VOICE_SRC.split(',')[1]),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const pr=AC.decodeAudioData(u.buffer,b=>{voiceBuf=b;},()=>{voiceLoading=false;});
    if(pr&&pr.catch)pr.catch(()=>{voiceLoading=false;});
  }catch(e){voiceLoading=false;}
}
function playVoice(){
  if(muted)return;
  try{
    if(AC&&voiceBuf){
      if(AC.state==='suspended')AC.resume();
      const sn=AC.createBufferSource();sn.buffer=voiceBuf;
      const g=AC.createGain();g.gain.value=1.3;sn.connect(g);g.connect(comp||master);duck(3.6);sn.start();return;
    }
    if(!voiceEl){voiceEl=new Audio(VOICE_SRC);voiceEl.preload='auto';}
    voiceEl.currentTime=0;voiceEl.volume=1;const pr=voiceEl.play();if(pr&&pr.catch)pr.catch(()=>{});
  }catch(e){}
}

const SR=58;
const mk=()=>({id:null,ox:0,oy:0,x:0,y:0,vx:0,vy:0,mag:0});
const sticks={move:mk(),aim:mk()};
const mouse={has:false,down:false,sx:0,sy:0};
const keys={};
let isTouch=false;
try{isTouch=window.matchMedia('(pointer:coarse)').matches;}catch(e){}
let state='title';

function setStick(s,x,y){
  const dx=x-s.ox,dy=y-s.oy,d=Math.hypot(dx,dy);
  const m=Math.min(1,d/SR);s.mag=m;
  if(d>0){s.vx=dx/d*m;s.vy=dy/d*m;}else{s.vx=0;s.vy=0;}
  const kd=Math.min(d,SR);
  s.x=s.ox+(d?dx/d*kd:0);s.y=s.oy+(d?dy/d*kd:0);

function resetInput(){

});

});
const endPtr=e=>{

const CDS=[10,14,20];
const cdBase=(c,i)=>(c.cds&&c.cds[i])||CDS[i];

function hurt(d){

function hitZ(z,dmg,vx,vy){
  if(z.dead)return;
  P.aggro=z;P.aggroT=3;
  const crit=Math.random()<critChance();
  if(crit)dmg*=2;
  if(z.type==='boss'&&z.shield>0){const sd=Math.min(z.shield,dmg);z.shield-=sd;dmg-=sd;if(z.shield<=0)shieldBreak(z);}
  z.hp-=dmg;z.hitT=.08;
  const n=Math.hypot(vx,vy)||1,k=z.type==='boss'?.4:(dmg>60?6:2.2);
  z.x+=vx/n*k;z.y+=vy/n*k;
  puff(z.x,z.y,3,'#7c1a14',110,.5,2.4);
  puff(z.x,z.y,crit?6:2,crit?'#ffe08a':'#ffd9a0',200,.22,2.6,'spark');
  addText(z.x,z.y-z.r-4,Math.round(dmg),crit);
  sfx(crit?'crit':'hit');
  if(crit){freeze=Math.max(freeze,.035);shake=Math.max(shake,3);}
  if(z.hp<=0)killZ(z);
}
function killZ(z){
  z.dead=true;waveKills++;runKills++;combo++;comboT=2.5;
  const cm=Math.min(3,1+Math.floor(combo/8));
  const base=z.type==='boss'?60:z.type==='mini'?25:z.type==='brute'?5:z.type==='runner'?3:2;
  money+=Math.round(base*cm*cashMul());
  if(R.vamp&&P.hp<P.max)P.hp=Math.min(P.max,P.hp+R.vamp);
  if(combo%5===0)say('COMBO x'+cm+'!',900);
  puff(z.x,z.y,z.type==='boss'?40:14,'#6d130f',180,.8,3.4);
  puff(z.x,z.y,z.type==='boss'?10:4,'#5b6b3d',110,.9,z.r*.5,'smoke');
  decals.push({x:z.x,y:z.y,r:z.r*(.9+Math.random()*.5),a:Math.random()*TAU});
  if(decals.length>90)decals.shift();
  sfx('die');
  if(z.type==='boss'){
    S.bossDead=true;boom(z.x,z.y,170,0,true,'255,90,60');say(z.bossName+' DEFEATED',2400);
    slowT=1.4;freeze=Math.max(freeze,.25);flash('255,230,200',.3);sfx('boom');
    for(let k=0;k<3;k++)drops.push({x:z.x+(k-1)*34,y:z.y+30,type:k===1?'hp':'money',life:30});
    return;
  }
  const ch=z.type==='brute'?.9:z.type==='runner'?.7:.65;
  if(Math.random()<ch)drops.push({x:z.x,y:z.y,type:Math.random()<.35?'hp':'money',life:16});
}
function boom(x,y,rad,dmg,fxOnly,col){
  ring(x,y,rad,col||'255,178,62',.38);
  ring(x,y,rad*.55,'255,255,230',.22);
  puff(x,y,22,'#ff9a2e',280,.6,4,'spark');puff(x,y,18,'#ffcf6a',220,.5,4);
  puff(x,y,10,'#3a3633',80,1.1,rad*.18,'smoke');
  shake=Math.max(shake,12);flash(col||'255,190,110',.12);sfx('boom');vib(60);
  if(fxOnly)return;
  for(const z of zombies){
    if(z.dead)continue;
    const d=Math.hypot(z.x-x,z.y-y);
    if(d<rad+z.r)hitZ(z,dmg*(1-.6*d/(rad+z.r)),z.x-x,z.y-y);
  }
  const pd=Math.hypot(P.x-x,P.y-y);
  if(pd<rad*.7)hurt(Math.round(6+16*(1-pd/(rad*.7))));
}
function makePool(x,y){
  if(venomPools.length>25)venomPools.shift();
  venomPools.push({x,y,t:0,life:10,r:52,tick:0});
  puff(x,y,10,'#5a1a8a',90,.5,4,'smoke');
}
function stink(x,y){
  ring(x,y,105,'100,255,50',.5);puff(x,y,14,'#72d83f',100,.8,6);puff(x,y,4,'#4f9a2c',40,1.0,18,'smoke');
  sfx('hiss');
  for(const z of zombies){if(!z.dead&&Math.hypot(z.x-x,z.y-y)<112){hitZ(z,D(28),z.x-x,z.y-y);z.sp*=.72;}}
}
function soccerBurst(b){
  stink(b.x,b.y);
  if(b.superStink)for(const zz of zombies)if(!zz.dead&&Math.hypot(zz.x-b.x,zz.y-b.y)<175){hitZ(zz,D(65),zz.x-b.x,zz.y-b.y);zz.sp*=.55;}
}
function inObs(x,y){for(const o of obs)if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return true;return false;}
function collide(e,r){
  let hit=false;
  for(const o of obs){
    const px=Math.max(o.x,Math.min(e.x,o.x+o.w)),py=Math.max(o.y,Math.min(e.y,o.y+o.h));
    const dx=e.x-px,dy=e.y-py,d2=dx*dx+dy*dy;
    if(d2<r*r){
      hit=true;
      if(d2===0){
        const l=e.x-o.x,rr=o.x+o.w-e.x,t=e.y-o.y,b=o.y+o.h-e.y,m=Math.min(l,rr,t,b);
        if(m===l)e.x=o.x-r;else if(m===rr)e.x=o.x+o.w+r;else if(m===t)e.y=o.y-r;else e.y=o.y+o.h+r;
      }else{const d=Math.sqrt(d2);e.x=px+dx/d*r;e.y=py+dy/d*r;}
    }
  }
  return hit;
}

/* ---------- update ---------- */
function update(dt){
  S.t+=dt;waveTime+=dt;runTime+=dt;

  let mx=0,my=0;
  if(sticks.move.id!==null){mx=sticks.move.vx;my=sticks.move.vy;}
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  let ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml;ml=1;}
  if(ml<.12){mx=0;my=0;ml=0;}

  let firing=false;
  const as=sticks.aim;
  if(as.id!==null&&as.mag>.2){P.angle=Math.atan2(as.vy,as.vx);firing=true;}
  else if(mouse.has&&!isTouch){
    const wx=(mouse.sx-W/2)/zoom+cx,wy=(mouse.sy-H/2)/zoom+cy;
    P.angle=Math.atan2(wy-P.y,wx-P.x);firing=mouse.down;
  }else if(ml>0&&as.id===null){P.angle=Math.atan2(my,mx);}
  if(keys[' '])firing=true;

  const sp=150*moveMul()*(firing?.85:1)*(P.ride?1.18:1)*(P.frost>0?.55:1);
  P.x=clamp(P.x+mx*sp*dt,14,WORLD-14);
  P.y=clamp(P.y+my*sp*dt,14,WORLD-14);
  collide(P,13);P.mv=ml;
  if(P.ride&&ml>0&&Math.random()<.5)puff(P.x,P.y+8,1,'#39ff6a',25,.35,4,'spark');

  comboT-=dt;if(comboT<=0)combo=0;
  P.fireT=Math.max(0,P.fireT-dt);P.flash-=dt;P.shootT=Math.max(0,P.shootT-dt);P.inv-=dt;P.hurtT-=dt;P.frost=Math.max(0,(P.frost||0)-dt);
  for(let i=0;i<3;i++){if(P.cd[i]>0){P.cd[i]-=dt;if(P.cd[i]<=0){P.cd[i]=0;if(up().skills[i])sfx('ready');}}}
  if(firing)tryShoot();

  for(let i=laters.length-1;i>=0;i--){laters[i].t-=dt;if(laters[i].t<=0){const f=laters[i].fn;laters.splice(i,1);f();}}

  if(P.hp<P.max*.3&&P.hp>0){S.heartT-=dt;if(S.heartT<=0){sfx('heart');S.heartT=.9;}}
  S.groanT-=dt;if(S.groanT<=0&&zombies.length){sfx('groan');S.groanT=rnd(1.8,4.5);}

  // spawning
  S.spawnT-=dt;
  if(S.spawned<WV.total&&zombies.length<WV.cap&&S.spawnT<=0){
    spawnZ(pickType());S.spawned++;S.spawnT=WV.gap*(.7+Math.random()*.6);
  }
  if(WV.boss&&!S.miniSpawned&&S.spawned>=Math.floor(WV.total*.25)){
    S.miniSpawned=true;const p=edgePos();spawnZ('mini',p.x,p.y,false);
    const mz=zombies[zombies.length-1];
    if(mz){mz.bossName=MINIS[Math.floor(wave/5-1)%MINIS.length];say(mz.bossName+' APPROACHES',2000);sfx('groan');}
  }
  if(WV.boss&&!S.bossSpawned&&S.spawned>=Math.floor(WV.total*.6)){
    S.bossSpawned=true;const p=edgePos();spawnZ('boss',p.x,p.y,false);
    const bz=zombies[zombies.length-1];
    if(bz){bz.hp*=1.6;bz.max=bz.hp;bz.sp*=1.15;bz.shield=bz.max*.5;bz.shieldMax=bz.shield;}
    say(WV.bossName+' ARRIVES',2200);sfx('boss');flash('255,60,40',.2);shake=Math.max(shake,10);vib([80,60,80]);
  }

  // zombies
  const dmgS=(1+Math.min(4,.08*(wave-1)))*DF().dmg;
  for(const z of zombies){
    if(z.dead)continue;
    const dx=P.x-z.x,dy=P.y-z.y,d=Math.hypot(dx,dy)||1;
    let ux=dx/d,uy=dy/d,spd=z.sp;
    z.hitT-=dt;
    if(z.type==='boss'||z.type==='mini')bossAbility(z,dt);
    if(z.type==='boss')bossAbility2(z,dt);
    if(z.type==='boss'){
      z.bt-=dt;
      if(z.state==='walk'){if(z.bt<=0){z.state='wind';z.bt=.8;}}
      else if(z.state==='wind'){spd=0;z.dirx=ux;z.diry=uy;if(z.bt<=0){z.state='dash';z.bt=.9;sfx('dash');}}
      else{
        spd=330;ux=z.dirx;uy=z.diry;
        if(Math.random()<.6)puff(z.x,z.y,1,BOSSCOL[z.bossName]||'#8d3f3a',30,.4,6,'smoke');
        if(z.bt<=0){z.state='walk';z.bt=6;}
      }
      z.sumT-=dt;
      if(z.sumT<=0){z.sumT=8;for(let k=0;k<3;k++)spawnZ('runner',z.x+(Math.random()-.5)*120,z.y+(Math.random()-.5)*120,true);}
    }
    if(z.type!=='boss'||z.state==='walk'){
      let ang=Math.sin(S.t*2+z.ph)*.3;
      if(z.slideT>0){z.slideT-=dt;ang+=z.slideDir*1.0;}
      const cs=Math.cos(ang),sn=Math.sin(ang),nx=ux*cs-uy*sn,ny=ux*sn+uy*cs;ux=nx;uy=ny;
    }
    z.x+=ux*spd*dt;z.y+=uy*spd*dt;
    z.ang=Math.atan2(dy,dx);
    for(const o of zombies){
      if(o===z||o.dead)continue;
      const ox=z.x-o.x,oy=z.y-o.y,dd=Math.hypot(ox,oy),mn=z.r+o.r-2;
      if(dd>0&&dd<mn){const pu=(mn-dd)*.5;z.x+=ox/dd*pu;z.y+=oy/dd*pu;}
    }
    if(collide(z,z.r)&&z.slideT<=0){z.slideT=.7;z.slideDir=Math.random()<.5?-1:1;}
    z.x=clamp(z.x,z.r,WORLD-z.r);z.y=clamp(z.y,z.r,WORLD-z.r);
    z.cd-=dt;
    if(d<z.r+17&&z.cd<=0){P.aggro=z;P.aggroT=3;hurt(Math.round(ZT[z.type].dmg*dmgS));z.cd=.9;}
  }

  updateAllies(dt);
  updateEnemyBullets(dt);
  for(let i=venomPools.length-1;i>=0;i--){const v=venomPools[i];v.t+=dt;v.tick-=dt;if(v.tick<=0){v.tick=.3;for(const z of zombies){if(!z.dead&&Math.hypot(z.x-v.x,z.y-v.y)<v.r+z.r)hitZ(z,D(9),0,0);}}if(v.t>=v.life)venomPools.splice(i,1);}
  for(let i=clouds.length-1;i>=0;i--){const c=clouds[i];c.t+=dt;c.tick-=dt;if(c.tick<=0){c.tick=.25;for(const z of zombies){if(!z.dead&&Math.hypot(z.x-c.x,z.y-c.y)<c.r+z.r)hitZ(z,D(10),0,0);}}if(c.t>=c.life)clouds.splice(i,1);}
  for(let i=eats.length-1;i>=0;i--){const e=eats[i];e.t+=dt;if(!e.bit&&e.t>=.35){e.bit=true;ring(P.x+Math.cos(P.angle)*22,P.y+Math.sin(P.angle)*22,30,'138,60,255',.3);puff(P.x+Math.cos(P.angle)*22,P.y+Math.sin(P.angle)*22,12,'#2a0f3d',120,.4,4,'spark');sfx('punch');}if(e.t>.6)eats.splice(i,1);}
  if(P.chomp>0)P.chomp-=dt;
  if(P.aggroT>0)P.aggroT-=dt;
  if(P.ride){P.rideT-=dt;if(P.rideT<=0){endRide();say('BALL RIDE OVER',1200);}}
  // ride ball: crushes anything it touches
  if(P.ride){
    for(const z of zombies){
      if(z.dead)continue;
      z.ballT=Math.max(0,(z.ballT||0)-dt);
      const d=Math.hypot(z.x-P.x,z.y-P.y);
      if(d<BALL_R+z.r&&z.ballT<=0){
        z.ballT=.32;
        const k=d||1;z.x+=(z.x-P.x)/k*26;z.y+=(z.y-P.y)/k*26;
        hitZ(z,D(110),z.x-P.x,z.y-P.y);
        ring(z.x,z.y,26,'57,255,106',.25);shake=Math.max(shake,2.5);
        puff(z.x,z.y,6,'#39ff6a',120,.35,3,'spark');
      }
    }
  }
  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.curve){const cc=Math.cos(b.curve*dt),ss=Math.sin(b.curve*dt);const nvx=b.vx*cc-b.vy*ss;b.vy=b.vx*ss+b.vy*cc;b.vx=nvx;}
    const n=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/8));
    const sx=b.vx*dt/n,sy=b.vy*dt/n;
    let dead=false;
    if(b.kind==='beam')puff(b.x,b.y,2,'#ff9a3a',40,.25,4);
    else if(b.kind==='ki'&&Math.random()<.5)puff(b.x,b.y,1,'#ffb060',25,.22,3);
    else if(b.kind==='star'&&Math.random()<.4)puff(b.x,b.y,1,'#ffe14a',20,.2,2.4,'spark');
    else if(b.kind==='soccer'&&Math.random()<.35)puff(b.x,b.y,2,'#7cdb4d',35,.35,3);
    else if(b.kind==='venom'&&Math.random()<.7)puff(b.x,b.y,2,'#6a2bb0',30,.3,3);
    else if(b.kind==='wave'&&Math.random()<.5)puff(b.x,b.y,1,'#ffe58a',30,.3,2.4,'spark');
    for(let k=0;k<n&&!dead;k++){
      b.x+=sx;b.y+=sy;
      if(b.x<0||b.y<0||b.x>WORLD||b.y>WORLD||inObs(b.x,b.y)){
        dead=true;
        if(b.kind==='soccer')soccerBurst(b);
        else puff(b.x,b.y,4,b.kind==='ki'||b.kind==='beam'?'#ff8a3c':'#ffd27a',130,.22,2,'spark');
        break;
      }
      for(const z of zombies){
        if(z.dead)continue;
        if(b.hit&&b.hit.has(z))continue;
        if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+(b.r||2)){
          if(b.kind==='soccer')soccerBurst(b);
          hitZ(z,b.dmg,b.vx,b.vy);
          if(b.pierce){(b.hit||(b.hit=new Set())).add(z);b.dmg*=.88;}
          else{dead=true;break;}
        }
      }
    }
    b.life-=dt;
    if(b.life<=0&&!dead){dead=true;if(b.kind==='soccer')soccerBurst(b);}
    if(dead&&b.pool)makePool(b.x,b.y);
    if(dead)bullets.splice(i,1);
  }
  zombies=zombies.filter(z=>!z.dead);

  // pickups (with magnet)
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.life-=dt;
    if(d.life<=0){drops.splice(i,1);continue;}
    const dd=Math.hypot(d.x-P.x,d.y-P.y);
    if(dd<110&&dd>0){const m=260*dt;d.x+=(P.x-d.x)/dd*m;d.y+=(P.y-d.y)/dd*m;}
    if(dd<26){
      if(d.type==='hp'){P.hp=Math.min(P.max,P.hp+25);addText(P.x,P.y-20,'+25',false,'#8dff9a');sfx('heal');}
      else{const g=Math.round(4*cashMul());money+=g;addText(P.x,P.y-20,'+$'+g,false,'#ffd45c');sfx('coin');}
      puff(d.x,d.y,6,d.type==='hp'?'#8dff9a':'#ffd45c',90,.3,2.4,'spark');
      drops.splice(i,1);
    }
  }

  // particles, rings, texts, arcs, ghosts
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    const f=Math.max(0,1-3*dt);p.vx*=f;p.vy*=f;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>rings[i].dur)rings.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.t+=dt;q.y-=(q.crit?55:40)*dt;if(q.t>q.life)texts.splice(i,1);}
  for(let i=arcs.length-1;i>=0;i--){arcs[i].t+=dt;if(arcs[i].t>.28)arcs.splice(i,1);}
  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].t+=dt;if(ghosts[i].t>.35)ghosts.splice(i,1);}
  shake=Math.max(0,shake-dt*22);

  // wave end
  if(!S.clearing&&S.spawned>=WV.total&&zombies.length===0&&(!WV.boss||S.bossDead)){
    S.clearing=true;S.clearT=.4;slowT=Math.max(slowT,1.2);
    sfx('clear');flash('255,230,170',.12);
  }
  if(S.clearing){S.clearT-=dt;if(S.clearT<=0)waveClear();}

  hud();
}

/* ---------- HUD ---------- */
const hudCache={};
function setText(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
const KEYS=['Q','E','R'];
function hud(){
  const hp=Math.max(0,P.hp),pct=(hp/P.max*100).toFixed(1);
  if(hudCache.hp!==pct){hudCache.hp=pct;$('hp').style.width=pct+'%';$('hpGhost').style.width=pct+'%';}
  setText('hpTxt',Math.ceil(hp)+' / '+P.max);
  setText('cash','$'+money);
  setText('combo',combo>1?'x'+Math.min(3,1+Math.floor(combo/8))+' · '+combo:'');
  setText('waveNum',String(wave));
  const c=character(),u=up();
  for(let i=0;i<3;i++){
    const sk=c.skills[i],un=u.skills[i],cd=P.cd[i],tot=cdBase(c,i)*cdMul();
    const el=$('sk'+i),cls='sk'+(!un?' lock':cd<=0?' rdy':'');
    const label=!un?'LOCKED':(i===2&&P.ride)?Math.ceil(P.rideT)+'s':cd>0?Math.ceil(cd)+'s':(isTouch?'READY':KEYS[i]);
    const key=cls+'|'+sk.name+'|'+label+'|'+(cd/tot).toFixed(2);
    if(hudCache['s'+i]!==key){
      hudCache['s'+i]=key;el.className=cls;
      el.children[1].textContent=label;el.children[2].textContent=sk.name;
      el.style.setProperty('--p',un?(cd/tot).toFixed(2):'0');
    }
  }
  let left=WV.total-S.spawned,boss=null;
  for(const z of zombies){if(z.type==='boss')boss=z;else if(!z.extra)left++;}
  if(WV.boss&&!S.bossDead)left++;
  setText('remain',String(left));
  const bb=$('bossbar'),showBoss=!!boss;
  if(bb.hidden===showBoss)bb.hidden=!showBoss;
  if(boss){$('bosshp').style.width=Math.max(0,boss.hp/boss.max*100)+'%';setText('bossName',boss.bossName+(boss.shield>0?' · SHIELD':''));}
}

/* ---------- drawing ---------- */
function drawFloor(){
  ctx.fillStyle=L.ground;ctx.fillRect(0,0,WORLD,WORLD);
  ctx.strokeStyle=L.grid;ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=WORLD;x+=L.tile){ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.moveTo(0,x);ctx.lineTo(WORLD,x);}
  ctx.stroke();
  if(L.decor==='road'){
    ctx.strokeStyle='#4a4630';ctx.lineWidth=5;ctx.setLineDash([36,30]);
    ctx.beginPath();ctx.moveTo(0,WORLD/2);ctx.lineTo(WORLD,WORLD/2);ctx.stroke();ctx.setLineDash([]);
  }else if(L.decor==='parking'){
    ctx.strokeStyle='#4d535e';ctx.lineWidth=3;ctx.beginPath();
    for(let x=70;x<WORLD;x+=140){ctx.moveTo(x,30);ctx.lineTo(x,150);ctx.moveTo(x,WORLD-30);ctx.lineTo(x,WORLD-150);}
    ctx.stroke();
  }else if(L.decor==='roof'){
    ctx.strokeStyle='#8a6a1f';ctx.lineWidth=14;ctx.setLineDash([28,28]);
    ctx.strokeRect(14,14,WORLD-28,WORLD-28);ctx.setLineDash([]);
  }else if(L.decor==='void'){
    ctx.strokeStyle='rgba(150,100,255,.18)';ctx.lineWidth=3;
    for(let r=120;r<700;r+=130){ctx.beginPath();ctx.arc(WORLD/2,WORLD/2,r,0,TAU);ctx.stroke();}
  }
  ctx.strokeStyle='#05070a';ctx.lineWidth=12;ctx.strokeRect(0,0,WORLD,WORLD);
}
function drawObs(){
  for(const o of obs){
    ctx.fillStyle='#0b0e13';ctx.fillRect(o.x+4,o.y+6,o.w,o.h);
    ctx.fillStyle=L.obsCol;ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=2;ctx.strokeRect(o.x+1,o.y+1,o.w-2,o.h-2);
    if(o.w>=40&&o.h>=40&&o.w<=170&&o.h<=170&&(L.decor==='road'||L.decor==='roof')){
      ctx.strokeStyle='rgba(0,0,0,.28)';ctx.beginPath();
      ctx.moveTo(o.x+4,o.y+4);ctx.lineTo(o.x+o.w-4,o.y+o.h-4);ctx.moveTo(o.x+o.w-4,o.y+4);ctx.lineTo(o.x+4,o.y+o.h-4);ctx.stroke();
    }
  }
}
function drawDrop(d,t){
  const bob=Math.sin(t*5+d.x)*2;
  if(d.life<4&&Math.floor(t*8)%2===0)return;

    ctx.strokeStyle='rgba('+r.col+','+(.85*(1-k))+')';ctx.lineWidth=1+4*(1-k);ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.stroke();
  }
  for(const a of arcs){
    const k=a.t/.28;
    ctx.globalAlpha=1-k;ctx.lineJoin='round';
    for(const [w,c] of [[5,'rgb('+a.col+')'],[1.6,'#ffffff']]){
      ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();
      a.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  if(P.flash>0){
    const fx=P.x+Math.cos(P.angle)*28,fy=P.y+Math.sin(P.angle)*28;
    const g=ctx.createRadialGradient(fx,fy,2,fx,fy,120);
    g.addColorStop(0,'rgba(255,178,62,.55)');g.addColorStop(1,'rgba(255,178,62,0)');
    ctx.fillStyle=g;ctx.fillRect(fx-120,fy-120,240,240);
  }
  ctx.globalCompositeOperation='source-over';
  // floating numbers
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const q of texts){
    const k=q.t/q.life,sz=(q.crit?22:14)*(1+.5*Math.max(0,1-q.t*9));
    ctx.globalAlpha=1-k*k;ctx.font='bold '+sz.toFixed(1)+'px '+FONT;
    ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(q.txt,q.x,q.y);
    ctx.fillStyle=q.crit?'#ffb23e':(q.col||'#fff');ctx.fillText(q.txt,q.x,q.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();

  // darkness around the survivor
  const px=(P.x-cx)*zoom+W/2,py=(P.y-cy)*zoom+H/2;
  const rr=Math.max(W,H)*.8;
  const vg=ctx.createRadialGradient(px,py,110*zoom,px,py,rr);
  vg.addColorStop(0,'rgba(5,7,11,0)');vg.addColorStop(1,'rgba(5,7,11,.82)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(state==='play'&&P.hp<P.max*.3){
    const a=.22+.14*Math.sin(t*7);
    const rg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    rg.addColorStop(0,'rgba(208,64,47,0)');rg.addColorStop(1,'rgba(208,64,47,'+a+')');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  if(P.hurtT>0){ctx.fillStyle='rgba(208,64,47,'+Math.min(.35,P.hurtT)+')';ctx.fillRect(0,0,W,H);}
  if(sfl.a>0){ctx.fillStyle='rgba('+sfl.col+','+sfl.a+')';ctx.fillRect(0,0,W,H);sfl.a=Math.max(0,sfl.a-frameDt*1.6);}
  drawSticks();
}

scr.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  audioInit();
  const act=b.dataset.act;
  if(act!=='buychar'&&act!=='upg'&&act!=='skillbuy'&&act!=='perk'&&act!=='run'&&act!=='next')sfx('click');
  switch(act){
    case 'signin':{
      const u=($('authUser').value||'').trim().toLowerCase(),pw=$('authPass').value||'',acc=getAccounts();
      if(!u||!pw){sfx('deny');showAuth('Enter a username and password.');break;}
      if(!acc[u]){sfx('deny');showAuth('No account with that name. Create one first.');break;}
      if(acc[u]!==hashPw(pw)){sfx('deny');showAuth('Wrong password.');break;}
      signIn(u);sfx('buy');showTitle();break;
    }
    case 'create':{
      const u=($('authUser').value||'').trim().toLowerCase(),pw=$('authPass').value||'',acc=getAccounts();
      if(u.length<3){sfx('deny');showAuth('Username must be at least 3 characters.');break;}
      if(pw.length<4){sfx('deny');showAuth('Password must be at least 4 characters.');break;}
      if(acc[u]){sfx('deny');showAuth('That name is taken.');break;}
      acc[u]=hashPw(pw);setAccounts(acc);signIn(u);sfx('buy');showTitle();break;
    }
    case 'signout':signOut();break;
    case 'chars':showCharacters();break;
    case 'upgrade':showUpgrades();break;
    case 'heroes':backTo=b.dataset.from||'title';showCharacters();break;
    case 'shop':backTo=b.dataset.from||'title';showUpgrades();break;
    case 'back':goBack();break;
    case 'pickhero':selectedChar=b.dataset.id;saveEconomy();showUpgrades();break;
    case 'upg':{
      const d=UPG.find(x=>x.k===b.dataset.k),u=up(),l=u[d.k],cost=upCost(d,l);
      if(l>=MAXL)break;
      if(money>=cost){
        money-=cost;u[d.k]++;saveEconomy();saveUpgrades();sfx('buy');
        if(d.k==='hp'&&P){P.max=maxHp();P.hp=Math.min(P.max,P.hp+12);}
        showUpgrades();
      }else{sfx('deny');showUpgrades('NOT ENOUGH CASH · NEED $'+(cost-money)+' MORE');}
      break;
    }
    case 'skillbuy':{
      const i=Number(b.dataset.skill),u=up(),sk=character().skills[i];
      if(sk&&!u.skills[i]){
        if(money>=sk.cost){money-=sk.cost;u.skills[i]=true;saveEconomy();saveUpgrades();sfx('buy');showUpgrades();}
        else{sfx('deny');showUpgrades('NOT ENOUGH CASH · NEED $'+(sk.cost-money)+' MORE');}
      }
      break;

    case 'dl':downloadGame();break;
    case 'redeem':redeemCode();break;
    case 'relock':ownedChars=['basic','ember'];selectedChar='basic';saveEconomy();showCode('Characters locked again. Buy them with cash or use the code.',true);break;
    case 'selectchar':selectedChar=b.dataset.id;up();saveUpgrades();saveEconomy();sfx('buy');showCharacters();break;
    case 'buychar':{
      const ch=CHARACTERS.find(c=>c.id===b.dataset.id);
      if(ch&&!ownedChars.includes(ch.id)){
        if(money>=ch.price){money-=ch.price;ownedChars.push(ch.id);selectedChar=ch.id;saveEconomy();sfx('buy');showCharacters();}
        else{sfx('deny');showCharacters('NOT ENOUGH CASH · NEED $'+(ch.price-money)+' MORE');}
      }
      break;
    }
    case 'perk':{
      const p=offer[Number(b.dataset.i)];
      if(p&&!perkChosen){perkChosen=p;R.taken.push(p.name);p.fn();sfx('buy');showClear();}
      break;
    }
    case 'run':if(isTouch&&!document.fullscreenElement)goFull();sfx('wave');newRun();break;
    case 'full':goFull();break;
    case 'diff':setDiff(b.dataset.d);showTitle();break;
    case 'next':sfx('click');setupArena(wave+1);begin();break;
    case 'menu':showTitle();break;
    case 'resume':resume();break;
    case 'sound':muted=!muted;b.textContent='SOUND: '+(muted?'OFF':'ON');if(!muted)sfx('click');break;
  }
});
scr.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='codeIn'){e.preventDefault();redeemCode();}});
$('pauseBtn').addEventListener('click',()=>{audioInit();sfx('click');pause();});
const rotEl=$('rot');$('rotOk').addEventListener('click',()=>rotEl.classList.add('off'));
for(let i=0;i<3;i++)$('sk'+i).addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(state==='play')useAbility(i);});

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  if(window.innerWidth!==W||window.innerHeight!==H)resize();
  const real=Math.min(.05,(now-last)/1000);last=now;frameDt=real;
  let ts=1;
  if(slowT>0){slowT-=real;ts=.3;}
  if(freeze>0){freeze-=real;ts=Math.min(ts,.08);}
  if(state==='play'&&isTouch&&H>W&&!rotEl.classList.contains('off'))pause();
  if(state==='play')update(real*ts);
  draw();
  requestAnimationFrame(loop);
}
if(user)showTitle();else showAuth();
requestAnimationFrame(loop);
})();
</script>
